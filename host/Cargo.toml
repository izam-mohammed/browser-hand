[package]
name = "browser-hand"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "MCP server and Chrome native messaging host for browser-hand"

[dependencies]
# Pinned to the minor: rmcp breaks often (docs/external/rmcp.md § Gotchas).
rmcp = { version = "~3.10.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time", "process", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
uuid = { version = "1.28", features = ["v4"] }
base64 = "0.23"
libc = "0.2"
anyhow = "1"
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
ab_glyph = "0.2.32"
# config.toml (plans/06-settings.md, Decision 5; docs/external/toml.md).
toml = "1.1.8"

# Windows only: named pipe security, the parent process, link counts, local
# time (plans/16-windows.md). Already in Cargo.lock through tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Time",
] }

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
tempfile = "3.27"
sha2 = "0.11"
