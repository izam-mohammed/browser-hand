name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host (rust)
    # The private repo's GitHub-hosted minutes are blocked, so the job runs
    # on the linux machine (system-notes plan 03).
    runs-on: [self-hosted, linux, izam-linux]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --release --locked
      - name: test and coverage
        # Fails when line coverage drops under the floor.
        run: cargo llvm-cov --locked --summary-only --fail-under-lines 70

  extension:
    name: extension (typescript)
    # The private repo's GitHub-hosted minutes are blocked, so the job runs
    # on the linux machine (system-notes plan 03).
    runs-on: [self-hosted, linux, izam-linux]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: lint
        run: npm run typecheck
      - name: build
        run: npm run build
      - name: test and coverage
        # Thresholds live in vitest.config.mjs.
        run: npm run coverage
