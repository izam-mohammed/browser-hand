name: Security

on:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions: {}

jobs:
  scan:
    permissions:
      contents: read
      pull-requests: write
    uses: izam-mohammed/.github/.github/workflows/security-scan.yml@b0add75acb9391555da00d7df77945c14436197d # main
    with:
      # Rust has no ecosystem value yet; the gate's osv-scanner stage still
      # reads host/Cargo.lock.
      ecosystem: node
      # The private repo's GitHub-hosted minutes are blocked, so the gate runs
      # on the linux machine, as ci.yml does.
      runs-on: '["self-hosted", "linux", "izam-linux"]'
