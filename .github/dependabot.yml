version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    assignees: [izam-mohammed]
    labels: ["dependencies", "github_actions", "ci"]
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /host
      - /scripts/prove/config-toml
      - /scripts/prove/gif-encode
      - /scripts/prove/rmcp-stdio
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore(deps)
    assignees: [izam-mohammed]
    labels: ["dependencies", "rust"]
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore(deps)
    assignees: [izam-mohammed]
    labels: ["dependencies", "javascript"]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
