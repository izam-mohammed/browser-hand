<!doctype html>
<meta charset="utf-8">
<title>browser-hand record proof</title>
<h1>Record proof</h1>
<ol>
  <li>Pin "browser-hand record proof" from Chrome's puzzle-piece menu, then click its toolbar button. Its badge should read REC.</li>
  <li>Type anything in Name.</li>
  <li>Click Save. The proof then clicks "Debugger target" itself.</li>
</ol>
<p id="state">Waiting for the toolbar button.</p>
<label for="name">Name</label> <input id="name" type="text">
<button id="save" type="button">Save</button>
<p><button id="cdp" type="button" style="margin-top:40px;padding:20px 40px">Debugger target</button></p>
